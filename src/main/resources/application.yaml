server:
  port: ${APP_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        name: CASHFLOW_JSESSIONID
        http-only: true
        same-site: lax

spring:
  application:
    name: ifs25045-p5-pbo2026-springboot-cashflow
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pbo2026_cashflow}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:tessa}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

vaadin:
  launch-browser: false

app:
  root:
    username: ${ROOT_USERNAME:admin}
    password: ${ROOT_PASSWORD:admin123}
  upload-dir: ${UPLOAD_DIR:uploads}
  # Kunci penanda tanda tangan cookie sesi (opsional). Kosong = acak tiap aplikasi start.
  session-secret: ${SESSION_SECRET:}
